<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F0">
<title>繼承系統表產生工具｜禹河法律事務所</title>
<style>
/* ── Design Tokens ── */
:root{
  --paper:#FAF7F0;--paper-raised:#FFFFFF;--paper-sunken:#F1ECE1;
  --ink:#211E1A;--ink-soft:#5B554D;--ink-faint:#8A8377;
  --seal:#9E2A24;--seal-bright:#C0392B;--seal-wash:#F3E3DF;
  --positive:#3A6B4F;--negative:#9E2A24;--warning:#A6741C;
  --rule:#DDD5C7;--rule-strong:#C4BAA6;
  --font-kai:"BiauKai","DFKai-SB","標楷體","KaiTi","STKaiti",serif;
  --font-song:"Noto Serif CJK TC","PMingLiU","新細明體","Songti TC",serif;
  --text-xs:.8125rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.1875rem;
  --text-xl:1.4375rem;--text-2xl:1.75rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.5rem;--space-6:2rem;
  --radius:3px;--radius-lg:4px;
  --border:1px solid var(--rule);--border-strong:1.5px solid var(--rule-strong);
  --border-seal:2px solid var(--seal);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-top:41px;background:var(--paper);color:var(--ink);
  font-family:var(--font-song);font-size:var(--text-base);line-height:1.6;
  -webkit-font-smoothing:antialiased}

/* ── App Shell ── */
.app-header{
  background:var(--paper-raised);border-bottom:var(--border-strong);
  padding:var(--space-3) var(--space-5);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:41px;z-index:100}
.app-header h1{
  font-family:var(--font-kai);font-size:var(--text-lg);
  margin:0;letter-spacing:.06em}
.app-header h1 span{color:var(--seal)}
.header-btns{display:flex;gap:var(--space-2)}
.btn{
  padding:var(--space-2) var(--space-4);border:var(--border);
  border-radius:var(--radius);background:var(--paper-raised);
  color:var(--ink);font-family:var(--font-kai);font-size:var(--text-sm);
  cursor:pointer;transition:background .15s}
.btn:hover{background:var(--paper-sunken)}
.btn-primary{
  background:var(--seal);color:#fff;border-color:var(--seal)}
.btn-primary:hover{background:var(--seal-bright);border-color:var(--seal-bright)}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}

.workspace{
  display:grid;grid-template-columns:420px 1fr;
  height:calc(100vh - 94px);overflow:hidden}
/* 手機：改為上下堆疊，兩區各自捲動 */
@media(max-width:820px){
  .workspace{grid-template-columns:1fr;height:auto;overflow:visible}
  .form-panel{border-right:none;border-bottom:var(--border-strong);max-height:none}
  .preview-panel{padding:var(--space-4) var(--space-2)}
  .preview-page{width:100%;min-height:0;padding:10mm 8mm;font-size:8pt}
}

/* ── Form Panel ── */
.form-panel{
  background:var(--paper-raised);border-right:var(--border-strong);
  overflow-y:auto;padding:var(--space-5)}
.section-head{
  font-family:var(--font-kai);font-size:var(--text-base);font-weight:700;
  color:var(--ink);margin:var(--space-5) 0 var(--space-3);
  padding-left:var(--space-3);border-left:3px solid var(--seal);
  letter-spacing:.04em}
.section-head:first-child{margin-top:0}
.field-row{display:grid;grid-template-columns:5.5em 1fr;gap:var(--space-2);
  align-items:center;margin-bottom:var(--space-2)}
.field-row label{
  font-size:var(--text-sm);color:var(--ink-soft);text-align:right;
  font-family:var(--font-kai)}
.field-row input,.field-row select{
  width:100%;padding:var(--space-2) var(--space-3);
  border:var(--border);border-radius:var(--radius);
  background:var(--paper);font-family:var(--font-song);
  font-size:var(--text-sm);color:var(--ink)}
.field-row input:focus,.field-row select:focus{
  outline:none;border-color:var(--rule-strong);
  box-shadow:0 0 0 3px var(--seal-wash)}
.opt-toggle{
  display:flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-sm);color:var(--ink-soft);
  margin-bottom:var(--space-3)}
.opt-toggle input[type=checkbox]{accent-color:var(--seal)}

/* Member cards */
.member-card{
  border:var(--border);border-radius:var(--radius-lg);
  padding:var(--space-3);margin-bottom:var(--space-3);
  background:var(--paper)}
.member-card-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--space-3)}
.member-card-title{
  font-family:var(--font-kai);font-size:var(--text-sm);
  color:var(--ink-soft);font-weight:700}
.member-card-title .name-preview{
  color:var(--seal);margin-left:var(--space-2)}
.proxy-section{
  margin-top:var(--space-3);padding-top:var(--space-3);
  border-top:var(--border)}
.proxy-label{
  font-size:var(--text-xs);color:var(--ink-faint);
  font-family:var(--font-kai);margin-bottom:var(--space-2)}
.proxy-card{
  background:var(--paper-sunken);border-radius:var(--radius);
  padding:var(--space-2) var(--space-3);margin-bottom:var(--space-2)}
.proxy-card .field-row{grid-template-columns:4.5em 1fr}
.add-row{
  display:flex;gap:var(--space-2);margin-top:var(--space-2)}

/* ── Preview Panel ── */
.preview-panel{
  overflow-y:auto;padding:var(--space-6);
  background:var(--paper-sunken);display:flex;
  flex-direction:column;align-items:center}
.preview-page{
  background:#fff;width:210mm;min-height:297mm;
  padding:20mm 22mm;font-family:var(--font-kai);
  font-size:10pt;box-shadow:0 2px 12px rgba(0,0,0,.1);
  position:relative}

/* ── Preview: 繼承系統表 Layout ── */
.p-title{
  text-align:center;font-size:14pt;font-weight:700;
  letter-spacing:.5em;border-bottom:1px solid #000;
  padding-bottom:8pt;margin-bottom:16pt}

/* 版面度量（對齊實務範本）：主幹線位置、各框寬度 */
.preview-page{--trunk:33mm;--childL:56mm;--boxW:42mm}

/* 上段：被繼承人（左）─虛線─ 配偶（右）
   配偶以絕對定位，避免其較高的框撐高整列、使主幹線與被繼承人框之間出現空隙 */
.p-top{position:relative;margin:0 0 0 8mm}
.p-box{border:1px solid #000;padding:5pt 7pt;font-size:9pt;line-height:1.9}
.p-box p{margin:0;white-space:nowrap}
.p-decedent{width:88mm;min-height:24mm}
.p-spouse-grp{
  position:absolute;left:92mm;top:0;bottom:0;
  display:flex;align-items:center}
.p-conn-h{
  flex:0 0 auto;width:8mm;
  border-top:1px dashed #000;margin:0 2mm}
.p-spouse{width:var(--boxW)}

/* 下段：垂直主幹 ＋ 各子女虛線分支 */
.p-tree{position:relative}
.p-child-row{
  position:relative;display:flex;align-items:center;
  padding-left:var(--childL);min-height:20mm}
/* 主幹：逐列堆疊成一條連續直線；最後一列只畫到分支處 */
.p-child-row::before{
  content:"";position:absolute;left:var(--trunk);top:0;bottom:0;
  border-left:1px solid #000}
.p-child-row:last-child::before{bottom:50%}
/* 分支：由主幹拉出的水平虛線 */
.p-child-row::after{
  content:"";position:absolute;left:var(--trunk);top:50%;
  width:calc(var(--childL) - var(--trunk));border-top:1px dashed #000}
.p-group-label{
  position:absolute;left:calc(var(--trunk) + 4mm);top:50%;
  transform:translateY(-160%);font-size:9pt;background:#fff;
  padding:0 2pt;z-index:1}
.p-child-box{
  border:1px solid #000;padding:4pt 6pt;font-size:9pt;
  line-height:1.9;width:var(--boxW);flex:0 0 auto;position:relative;z-index:1}
.p-child-box p{margin:0;white-space:nowrap}
/* 代位繼承人：以短虛線連向右側，多人合併於同一框 */
.p-proxy-conn{
  flex:0 0 auto;align-self:center;width:8mm;
  border-top:1px dashed #000;margin:0 2mm}
.p-proxies{
  border:1px solid #000;padding:4pt 6pt;font-size:9pt;
  line-height:1.9;width:var(--boxW);flex:0 0 auto}
.p-proxies .pg{margin:0}
.p-proxies .pg+.pg{margin-top:8pt}
.p-proxies p{margin:0;white-space:nowrap}

/* ── Print Media ── */
@media print{
  .sys-nav{display:none!important}
  html,body{padding-top:0!important}
  .app-header,.form-panel,.preview-panel>*:not(.preview-page){display:none!important}
  .workspace{display:block;height:auto}
  .preview-panel{
    padding:0;background:white;
    display:block}
  .preview-page{
    box-shadow:none;width:100%;min-height:0;
    padding:15mm 18mm}
}

/* ── 民國日期輸入（文字欄 ＋ 月曆選擇鈕）── */
.date-wrap{display:flex;gap:4px;align-items:center}
.date-wrap input[type=text]{flex:1;min-width:0}
/* 📅 鈕（開啟自製民國月曆） */
.date-pick{
  flex-shrink:0;width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;
  border:var(--border);border-radius:var(--radius);
  background:var(--paper-raised);color:var(--ink-soft);
  cursor:pointer;font-size:var(--text-sm);line-height:1;padding:0}
.date-pick:hover{background:var(--seal-wash);color:var(--seal);border-color:var(--seal)}

/* ── 民國月曆 ── */
.roc-cal{
  position:absolute;z-index:9998;width:268px;
  background:var(--paper-raised);border:1px solid var(--rule-strong);
  border-radius:var(--radius-lg);box-shadow:0 6px 24px rgba(33,30,26,.18);
  padding:10px;font-family:var(--font-song);display:none}
.roc-cal.on{display:block}
.roc-cal-head{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.roc-cal-head button{
  width:26px;height:26px;flex-shrink:0;border:var(--border);
  border-radius:var(--radius);background:var(--paper-raised);
  color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;padding:0}
.roc-cal-head button:hover{border-color:var(--seal);color:var(--seal)}
.roc-cal-head .lbl{font-size:12px;color:var(--ink-soft);font-family:var(--font-kai)}
.roc-cal-head input.ry{
  width:52px;padding:3px 5px;text-align:center;
  border:var(--border);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);font-size:13px;
  font-variant-numeric:tabular-nums}
.roc-cal-head select.rm{
  padding:3px 4px;border:var(--border);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);font-size:13px}
.roc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.roc-cal-grid .dow{
  text-align:center;font-size:11px;color:var(--ink-faint);
  padding:3px 0;font-family:var(--font-kai)}
.roc-cal-grid .dow.sun{color:var(--seal)}
.roc-cal-grid button{
  border:1px solid transparent;border-radius:var(--radius);
  background:transparent;color:var(--ink);cursor:pointer;
  padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.roc-cal-grid button:hover{background:var(--seal-wash);color:var(--seal)}
.roc-cal-grid button.today{border-color:var(--seal);color:var(--seal);font-weight:700}
.roc-cal-grid button.blank{visibility:hidden;cursor:default}
.roc-cal-foot{
  display:flex;gap:6px;justify-content:space-between;
  margin-top:8px;padding-top:8px;border-top:var(--border)}
.roc-cal-foot button{
  border:var(--border);border-radius:var(--radius);background:var(--paper-raised);
  color:var(--ink-soft);cursor:pointer;font-size:12px;padding:4px 10px;
  font-family:var(--font-kai)}
.roc-cal-foot button:hover{border-color:var(--seal);color:var(--seal)}

/* ── 登入畫面（與其他系統相同帳號） ── */
.login-wrap{min-height:calc(100vh - 41px);display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper)}
.login-box{background:var(--paper-raised);border:1px solid var(--rule-strong);border-top:3px solid var(--seal);border-radius:4px;padding:40px 36px;width:100%;max-width:380px}
.login-err{background:var(--seal-wash);border:1px solid transparent;color:var(--seal);border-radius:2px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.login-box label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-family:var(--font-kai)}
.login-box input{width:100%;padding:10px 13px;border:var(--border);border-radius:var(--radius);background:var(--paper);font-size:16px;color:var(--ink);font-family:var(--font-song)}
.login-box input:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-wash)}

/* ── Utilities ── */
.hint{font-size:var(--text-xs);color:var(--ink-faint);margin-top:2px}
.divider{border:none;border-top:var(--border);margin:var(--space-4) 0}
</style>
</head>
<body>
<script src="shared/sys-nav.js" data-active="heirship"></script>

<!-- 登入閘：驗證前先擋住工具內容 -->
<div id="gate" class="login-wrap">
  <div class="login-box">
    <div style="font-size:44px;text-align:center;margin-bottom:8px">🌳</div>
    <div style="font-family:var(--font-kai);font-size:1.15rem;color:var(--seal);text-align:center;margin-bottom:3px">繼承系統表產生工具</div>
    <div style="font-size:10px;color:var(--ink-faint);text-align:center;letter-spacing:.1em;margin-bottom:24px;text-transform:uppercase">Heirship Chart</div>
    <div id="lerr" style="display:none" class="login-err"></div>
    <div style="margin-bottom:12px"><label>帳號</label><input id="lem" type="email" autocomplete="email" placeholder="office@yourfirm.com"></div>
    <div style="margin-bottom:22px"><label>密碼</label>
      <div style="position:relative"><input id="lpw" type="password" placeholder="••••••••" style="padding-right:40px">
      <button id="spw" type="button" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px">👁</button></div>
    </div>
    <button id="lbtn" class="btn btn-primary" style="width:100%;justify-content:center;font-size:14px;padding:12px">🔐 登入</button>
    <div style="font-size:11px;color:var(--ink-faint);text-align:center;margin-top:14px">與其他系統使用相同帳號</div>
  </div>
</div>

<div id="appwrap" style="display:none">
<header class="app-header">
  <h1>繼承系統表<span>產生工具</span></h1>
  <div class="header-btns">
    <button class="btn btn-sm" onclick="clearAll()">清除</button>
    <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 列印／另存 PDF</button>
    <button class="btn btn-sm" id="btn-logout" title="登出">🚪</button>
  </div>
</header>

<div class="workspace">

<!-- ═══════════════ FORM PANEL ═══════════════ -->
<div class="form-panel" id="formPanel">

  <!-- 被繼承人 -->
  <div class="section-head">被繼承人</div>
  <div class="field-row">
    <label>姓名</label>
    <input type="text" id="d-name" placeholder="例：駱光星" oninput="render()">
  </div>
  <div class="field-row">
    <label>稱謂</label>
    <input type="text" id="d-rel" placeholder="例：次男" oninput="render()">
  </div>
  <div class="field-row">
    <label>出生日</label>
    <div class="date-wrap"><input type="text" id="d-dob" placeholder="民國18年12月28日" oninput="render()"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
  </div>
  <div class="field-row">
    <label>死亡日</label>
    <div class="date-wrap"><input type="text" id="d-dod" placeholder="民國115年4月2日" oninput="render()"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
  </div>

  <!-- 配偶 -->
  <div class="section-head">配偶</div>
  <label class="opt-toggle">
    <input type="checkbox" id="sp-toggle" onchange="toggleSpouse();render()"> 有配偶
  </label>
  <div id="sp-fields" style="display:none">
    <div class="field-row">
      <label>姓名</label>
      <input type="text" id="sp-name" placeholder="例：林阿桃" oninput="render()">
    </div>
    <div class="field-row">
      <label>出生日</label>
      <div class="date-wrap"><input type="text" id="sp-dob" placeholder="民國30年4月24日" oninput="render()"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
    </div>
    <div class="field-row">
      <label>死亡日</label>
      <div class="date-wrap"><input type="text" id="sp-dod" placeholder="民國--年--月--日" oninput="render()"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
    </div>
    <div class="field-row">
      <label>離婚日</label>
      <div class="date-wrap"><input type="text" id="sp-divorce" placeholder="（無則留空）" oninput="render()"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
    </div>
    <div class="field-row">
      <label>繼承情形</label>
      <select id="sp-status" onchange="render()">
        <option value="繼承">繼承</option>
        <option value="死亡">死亡</option>
        <option value="拋棄繼承">拋棄繼承</option>
      </select>
    </div>
  </div>

  <!-- 繼承群組 -->
  <div class="section-head">繼承群組</div>
  <div class="field-row">
    <label>群組標籤</label>
    <input type="text" id="grp-label" value="子女" oninput="render()">
  </div>
  <div id="members-container"></div>
  <button class="btn btn-sm" onclick="addMember()">＋ 新增成員</button>


</div><!-- /form-panel -->

<!-- ═══════════════ PREVIEW PANEL ═══════════════ -->
<div class="preview-panel">
  <div class="preview-page" id="previewPage">
    <!-- rendered by render() -->
  </div>
</div>

</div><!-- /workspace -->
</div><!-- /appwrap -->

<!-- 登入（與其他系統共用同一組 Firebase 帳號） -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyB2sIWbUmp2TvnDGulat2BQGb7HMYBvfA0",authDomain:"legalcasemanageer.firebaseapp.com",projectId:"legalcasemanageer",storageBucket:"legalcasemanageer.firebasestorage.app",messagingSenderId:"559838504556",appId:"1:559838504556:web:ba10c071a12650bbd85a49"};
const auth=getAuth(initializeApp(cfg));
const $=id=>document.getElementById(id);

onAuthStateChanged(auth,u=>{
  // 忽略匿名登入（僅帳號密碼登入者視為管理員），與其他系統一致
  const ok = u && !u.isAnonymous;
  $("gate").style.display   = ok ? "none"  : "flex";
  $("appwrap").style.display= ok ? "block" : "none";
});

async function go(){
  const em=$("lem").value.trim(), pw=$("lpw").value, err=$("lerr");
  if(!em||!pw){ err.style.display="block"; err.textContent="請輸入帳號密碼"; return; }
  err.style.display="none"; $("lbtn").textContent="登入中…";
  try{ await signInWithEmailAndPassword(auth,em,pw); }
  catch(e){
    err.style.display="block";
    err.textContent={"auth/invalid-credential":"帳號或密碼錯誤","auth/too-many-requests":"嘗試次數過多，請稍後再試","auth/user-disabled":"此帳號已停用","auth/unauthorized-domain":"此網域未獲 Firebase 授權","auth/network-request-failed":"網路連線問題，請確認網路後再試"}[e.code]||("登入失敗（"+e.code+"）");
  }
  $("lbtn").textContent="🔐 登入";
}
$("lbtn").addEventListener("click",go);
$("lpw").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
$("spw").addEventListener("click",()=>{ const i=$("lpw"); i.type=i.type==="password"?"text":"password"; });
$("btn-logout").addEventListener("click",async()=>{ if(confirm("確認登出？")) await signOut(auth); });
</script>

<script>
/* ═══════════════════════════════════════════════
   民國日期選擇（選西元日期 → 自動轉民國年填入）
   ═══════════════════════════════════════════════ */
function rocFromISO(iso){
  const p = String(iso||'').split('-');
  if(p.length!==3) return '';
  const y = parseInt(p[0],10)-1911;
  if(isNaN(y)) return '';
  return `民國${y}年${parseInt(p[1],10)}月${parseInt(p[2],10)}日`;
}
// 申請日欄位不冠「民國」（版面已有「中華民國」字樣）
function rocShort(iso){
  const p = String(iso||'').split('-');
  if(p.length!==3) return '';
  return `${parseInt(p[0],10)-1911}年${parseInt(p[1],10)}月${parseInt(p[2],10)}日`;
}
/* ── 自製民國月曆（原生選擇器無法顯示民國年，故自建） ── */
let _rcTarget=null, _rcShort=false, _rcY=0, _rcM=0;

function rocParse(str){ // 「民國114年8月14日」/「114年8月14日」→ {y,m,d}（民國年）
  const m = String(str||'').match(/(\d{1,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  return m ? {y:+m[1], m:+m[2], d:+m[3]} : null;
}
function rocCalEl(){
  let el=document.getElementById('rocCal');
  if(el) return el;
  el=document.createElement('div');
  el.id='rocCal'; el.className='roc-cal';
  el.innerHTML=
    '<div class="roc-cal-head">'+
      '<button type="button" data-nav="-1" title="上個月">‹</button>'+
      '<span class="lbl">民國</span><input class="ry" type="number" min="1" max="200" inputmode="numeric"><span class="lbl">年</span>'+
      '<select class="rm">'+Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('')+'</select>'+
      '<button type="button" data-nav="1" title="下個月" style="margin-left:auto">›</button>'+
    '</div>'+
    '<div class="roc-cal-grid" id="rocCalGrid"></div>'+
    '<div class="roc-cal-foot">'+
      '<button type="button" data-act="clear">清除</button>'+
      '<button type="button" data-act="today">今天</button>'+
    '</div>';
  document.body.appendChild(el);
  el.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');
    if(nav){ _rcM+=+nav.dataset.nav; if(_rcM<1){_rcM=12;_rcY--;} if(_rcM>12){_rcM=1;_rcY++;} rocCalDraw(); return; }
    const act=e.target.closest('[data-act]');
    if(act){
      if(act.dataset.act==='clear'){ rocCalSet(''); }
      else { const n=new Date(Date.now()+8*3600000);
             rocCalPick(n.getUTCFullYear()-1911, n.getUTCMonth()+1, n.getUTCDate()); }
      return;
    }
    const day=e.target.closest('[data-day]');
    if(day) rocCalPick(_rcY,_rcM,+day.dataset.day);
  });
  el.querySelector('.ry').addEventListener('input',e=>{ const v=+e.target.value; if(v>0){ _rcY=v; rocCalDraw(true);} });
  el.querySelector('.rm').addEventListener('change',e=>{ _rcM=+e.target.value; rocCalDraw(); });
  el.addEventListener('mousedown',e=>e.stopPropagation());
  return el;
}
function rocCalDraw(keepYearInput){
  const el=rocCalEl();
  if(!keepYearInput) el.querySelector('.ry').value=_rcY;
  el.querySelector('.rm').value=_rcM;
  const first=new Date(Date.UTC(_rcY+1911,_rcM-1,1));
  const startDow=first.getUTCDay();
  const days=new Date(Date.UTC(_rcY+1911,_rcM,0)).getUTCDate();
  const now=new Date(Date.now()+8*3600000);
  const tY=now.getUTCFullYear()-1911, tM=now.getUTCMonth()+1, tD=now.getUTCDate();
  let h=['日','一','二','三','四','五','六']
        .map((d,i)=>`<div class="dow${i===0?' sun':''}">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) h+='<button class="blank" disabled></button>';
  for(let d=1;d<=days;d++){
    const isT=(_rcY===tY&&_rcM===tM&&d===tD);
    h+=`<button type="button" data-day="${d}"${isT?' class="today"':''}>${d}</button>`;
  }
  document.getElementById('rocCalGrid').innerHTML=h;
}
function rocCalSet(val){
  if(_rcTarget){
    _rcTarget.value=val;
    _rcTarget.dispatchEvent(new Event('input',{bubbles:true})); // 觸發既有預覽更新
  }
  rocCalClose();
}
function rocCalPick(y,m,d){
  rocCalSet(_rcShort ? `${y}年${m}月${d}日` : `民國${y}年${m}月${d}日`);
}
function rocCalClose(){ const el=document.getElementById('rocCal'); if(el) el.classList.remove('on'); _rcTarget=null; }

function openRocCal(btn, short){
  const wrap=btn.closest('.date-wrap');
  _rcTarget=wrap && wrap.querySelector('input[type=text]');
  if(!_rcTarget) return;
  _rcShort=!!short;
  const cur=rocParse(_rcTarget.value);
  const now=new Date(Date.now()+8*3600000);
  _rcY = cur ? cur.y : now.getUTCFullYear()-1911;
  _rcM = cur ? cur.m : now.getUTCMonth()+1;
  const el=rocCalEl();
  el.classList.add('on');
  rocCalDraw();
  // 定位：預設按鈕下方，超出視窗則往上／往左修正
  const r=btn.getBoundingClientRect();
  const w=el.offsetWidth, hh=el.offsetHeight;
  let left=window.scrollX+r.left, top=window.scrollY+r.bottom+4;
  if(left+w>window.scrollX+document.documentElement.clientWidth-8)
    left=window.scrollX+document.documentElement.clientWidth-w-8;
  if(r.bottom+hh+8>window.innerHeight) top=window.scrollY+r.top-hh-4;
  el.style.left=Math.max(8,left)+'px';
  el.style.top=Math.max(8,top)+'px';
}
document.addEventListener('mousedown',()=>rocCalClose());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') rocCalClose(); });

/* ═══════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════ */
let members = [];   // {id, name, rel, dob, dod, status, proxies:[{name,rel,dob,dod,status}]}
let memberIdx = 0;

/* ═══════════════════════════════════════════════
   Member / Proxy Management
   ═══════════════════════════════════════════════ */
function addMember(){
  const id = ++memberIdx;
  members.push({id, name:'', rel:'', dob:'', dod:'', status:'繼承', proxies:[]});
  renderForm();
  render();
}

function removeMember(id){
  members = members.filter(m=>m.id!==id);
  renderForm(); render();
}

function updateMember(id, field, val){
  const m = members.find(m=>m.id===id);
  if(m){ m[field]=val; render(); }
}

function onStatusChange(id, val){
  updateMember(id, 'status', val);
  renderForm();
}

function addProxy(memberId){
  const m = members.find(m=>m.id===memberId);
  if(m) m.proxies.push({name:'',rel:'',dob:'',dod:'',status:'繼承'});
  renderForm(); render();
}

function removeProxy(memberId, pIdx){
  const m = members.find(m=>m.id===memberId);
  if(m){ m.proxies.splice(pIdx,1); renderForm(); render(); }
}

function updateProxy(memberId, pIdx, field, val){
  const m = members.find(m=>m.id===memberId);
  if(m && m.proxies[pIdx]){ m.proxies[pIdx][field]=val; render(); }
}

/* ═══════════════════════════════════════════════
   Form Rendering
   ═══════════════════════════════════════════════ */
const STATUS_OPTS = ['繼承','死亡','代位繼承','拋棄繼承','喪失繼承權'];
const REL_OPTS = ['長男','次男','三男','肆男','伍男','長女','次女','三女','肆女','父','母','長兄','次兄','長姊'];

function relSelect(val, onChange){
  const opts = REL_OPTS.map(r=>`<option${r===val?' selected':''}>${r}</option>`).join('');
  return `<select onchange="${onChange}" style="flex:1">
    <option value="">-- 選擇 --</option>${opts}
    <option value="__custom">自訂…</option>
  </select>`;
}

function renderForm(){
  const container = document.getElementById('members-container');
  container.innerHTML = members.map((m,idx)=>{
    const needProxy = m.status==='代位繼承';
    const proxyHTML = needProxy ? `
      <div class="proxy-section">
        <div class="proxy-label">代位繼承人</div>
        ${m.proxies.map((p,pi)=>`
          <div class="proxy-card">
            <div class="member-card-head">
              <span class="member-card-title">代位繼承人 ${pi+1}</span>
              <button class="btn btn-sm" onclick="removeProxy(${m.id},${pi})">移除</button>
            </div>
            <div class="field-row">
              <label>姓名</label>
              <input type="text" value="${p.name}" placeholder="姓名"
                oninput="updateProxy(${m.id},${pi},'name',this.value)">
            </div>
            <div class="field-row">
              <label>稱謂</label>
              <input type="text" value="${p.rel}" placeholder="例：長男"
                oninput="updateProxy(${m.id},${pi},'rel',this.value)">
            </div>
            <div class="field-row">
              <label>出生日</label>
              <div class="date-wrap"><input type="text" value="${p.dob}" placeholder="民國--年--月--日"
                oninput="updateProxy(${m.id},${pi},'dob',this.value)"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
            </div>
            <div class="field-row">
              <label>死亡日</label>
              <div class="date-wrap"><input type="text" value="${p.dod}" placeholder="民國--年--月--日"
                oninput="updateProxy(${m.id},${pi},'dod',this.value)"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
            </div>
            <div class="field-row">
              <label>繼承情形</label>
              <select onchange="updateProxy(${m.id},${pi},'status',this.value)">
                ${STATUS_OPTS.filter(s=>s!=='代位繼承').map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-sm" onclick="addProxy(${m.id})">＋ 新增代位繼承人</button>
      </div>` : '';

    return `
    <div class="member-card">
      <div class="member-card-head">
        <span class="member-card-title">成員 ${idx+1}
          <span class="name-preview">${m.name||'（未命名）'}</span>
        </span>
        <button class="btn btn-sm" onclick="removeMember(${m.id})">移除</button>
      </div>
      <div class="field-row">
        <label>姓名</label>
        <input type="text" value="${m.name}" placeholder="姓名"
          oninput="updateMember(${m.id},'name',this.value);this.closest('.member-card').querySelector('.name-preview').textContent=this.value||'（未命名）'">
      </div>
      <div class="field-row">
        <label>稱謂</label>
        <input type="text" value="${m.rel}" placeholder="例：長男、肆男、長女"
          oninput="updateMember(${m.id},'rel',this.value)">
      </div>
      <div class="field-row">
        <label>出生日</label>
        <div class="date-wrap"><input type="text" value="${m.dob}" placeholder="民國--年--月--日"
          oninput="updateMember(${m.id},'dob',this.value)"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
      </div>
      <div class="field-row">
        <label>死亡日</label>
        <div class="date-wrap"><input type="text" value="${m.dod}" placeholder="民國--年--月--日"
          oninput="updateMember(${m.id},'dod',this.value)"><button type="button" class="date-pick" title="選擇日期" onmousedown="event.stopPropagation()" onclick="openRocCal(this,false)">📅</button></div>
      </div>
      <div class="field-row">
        <label>繼承情形</label>
        <select onchange="onStatusChange(${m.id},this.value)">
          ${STATUS_OPTS.map(s=>`<option${s===m.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      ${proxyHTML}
    </div>`;
  }).join('');
}


/* ═══════════════════════════════════════════════
   Spouse toggle
   ═══════════════════════════════════════════════ */
function toggleSpouse(){
  const on = document.getElementById('sp-toggle').checked;
  document.getElementById('sp-fields').style.display = on?'block':'none';
}

/* ═══════════════════════════════════════════════
   Preview Rendering
   ═══════════════════════════════════════════════ */
function fmtDate(s){ return s&&s.trim() ? s.trim() : '民國--年--月--日'; }
function fmtDisDate(s){ return s&&s.trim() ? s.trim() : '民國--年--月--日'; }

function boxHTML(lines){
  return `<div class="p-box">${lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function render(){
  const dName    = document.getElementById('d-name').value.trim();
  const dRel     = document.getElementById('d-rel').value.trim();
  const dDob     = document.getElementById('d-dob').value.trim();
  const dDod     = document.getElementById('d-dod').value.trim();
  const spOn     = document.getElementById('sp-toggle').checked;
  const spName   = document.getElementById('sp-name').value.trim();
  const spDob    = document.getElementById('sp-dob').value.trim();
  const spDod    = document.getElementById('sp-dod').value.trim();
  const spDiv    = document.getElementById('sp-divorce').value.trim();
  const spStatus = document.getElementById('sp-status').value;
  const grpLabel = document.getElementById('grp-label').value.trim() || '子女';

  /* 被繼承人 box（沿用實務範本用語「被繼承者」） */
  const decedentBox = `<div class="p-box p-decedent">` +
    [`被繼承者：${dName}`,`稱謂：${dRel}`,`出生日：${fmtDate(dDob)}`,`死亡日：${fmtDate(dDod)}`]
      .map(l=>`<p>${esc(l)}</p>`).join('') + `</div>`;

  /* 配偶：以短虛線連向右側 */
  let spouseHTML = '';
  if(spOn && spName){
    const spLines = [
      `姓名：${spName}`, `稱謂：配偶`, `離婚日：${fmtDisDate(spDiv)}`,
      `出生日：${fmtDate(spDob)}`, `死亡日：${fmtDate(spDod)}`,
      `繼承情形：${spStatus}`
    ];
    spouseHTML = `<div class="p-spouse-grp"><div class="p-conn-h"></div><div class="p-box p-spouse">` +
      spLines.map(l=>`<p>${esc(l)}</p>`).join('') + `</div></div>`;
  }

  /* 子女列：主幹＋虛線分支；代位繼承人合併於同一框 */
  const childRows = members.map((m, idx)=>{
    const proxies = (m.status==='代位繼承') ? (m.proxies||[]) : [];
    const label = idx===0 ? `<div class="p-group-label">${esc(grpLabel)}</div>` : '';

    const childBox = `<div class="p-child-box">` +
      [`姓名：${m.name||''}`,`稱謂：${m.rel||''}`,`出生日：${fmtDate(m.dob)}`,
       `死亡日：${fmtDate(m.dod)}`,`繼承情形：${m.status}`]
        .map(l=>`<p>${esc(l)}</p>`).join('') + `</div>`;

    const proxyHTML = proxies.length
      ? `<div class="p-proxy-conn"></div><div class="p-proxies">` +
        proxies.map(pr=>`<div class="pg">` +
          [`姓名：${pr.name||''}`,`稱謂：${pr.rel||''}`,`出生日：${fmtDate(pr.dob)}`,
           `死亡日：${fmtDate(pr.dod)}`,`繼承情形：${pr.status||'繼承'}`]
            .map(l=>`<p>${esc(l)}</p>`).join('') + `</div>`).join('') + `</div>`
      : '';

    return `<div class="p-child-row">${label}${childBox}${proxyHTML}</div>`;
  }).join('');

  document.getElementById('previewPage').innerHTML = `
    <div class="p-title">繼　承　系　統　表</div>
    <div class="p-top">${decedentBox}${spouseHTML}</div>
    <div class="p-tree">${childRows}</div>
  `;
}

/* ═══════════════════════════════════════════════
   Utilities
   ═══════════════════════════════════════════════ */
function clearAll(){
  if(!confirm('確定清除所有輸入？')) return;
  document.querySelectorAll('#formPanel input[type=text], #formPanel input[type=checkbox], #formPanel select')
    .forEach(el=>{
      if(el.type==='checkbox') el.checked=false;
      else if(el.tagName==='SELECT') el.selectedIndex=0;
      else el.value='';
    });
  document.getElementById('grp-label').value='子女';
  members=[]; memberIdx=0;
  document.getElementById('sp-fields').style.display='none';
  renderForm(); addMember(); render();
}

/* ═══════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════ */
(function init(){
  // 以空白表單啟動（不預載任何當事人資料）
  addMember(); // 先給一列成員方便直接輸入
  render();
})();
</script>
