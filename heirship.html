<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF7F0">
<title>繼承系統表產生工具｜禹河法律事務所</title>
<style>
/* ── Design Tokens ── */
:root{
  --paper:#FAF7F0;--paper-raised:#FFFFFF;--paper-sunken:#F1ECE1;
  --ink:#211E1A;--ink-soft:#5B554D;--ink-faint:#8A8377;
  --seal:#9E2A24;--seal-bright:#C0392B;--seal-wash:#F3E3DF;
  --positive:#3A6B4F;--negative:#9E2A24;--warning:#A6741C;
  --rule:#DDD5C7;--rule-strong:#C4BAA6;
  --font-kai:"BiauKai","DFKai-SB","標楷體","KaiTi","STKaiti",serif;
  --font-song:"Noto Serif CJK TC","PMingLiU","新細明體","Songti TC",serif;
  --text-xs:.8125rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.1875rem;
  --text-xl:1.4375rem;--text-2xl:1.75rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.5rem;--space-6:2rem;
  --radius:3px;--radius-lg:4px;
  --border:1px solid var(--rule);--border-strong:1.5px solid var(--rule-strong);
  --border-seal:2px solid var(--seal);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-top:41px;background:var(--paper);color:var(--ink);
  font-family:var(--font-song);font-size:var(--text-base);line-height:1.6;
  -webkit-font-smoothing:antialiased}

/* ── App Shell ── */
.app-header{
  background:var(--paper-raised);border-bottom:var(--border-strong);
  padding:var(--space-3) var(--space-5);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:41px;z-index:100}
.app-header h1{
  font-family:var(--font-kai);font-size:var(--text-lg);
  margin:0;letter-spacing:.06em}
.app-header h1 span{color:var(--seal)}
.header-btns{display:flex;gap:var(--space-2)}
.btn{
  padding:var(--space-2) var(--space-4);border:var(--border);
  border-radius:var(--radius);background:var(--paper-raised);
  color:var(--ink);font-family:var(--font-kai);font-size:var(--text-sm);
  cursor:pointer;transition:background .15s}
.btn:hover{background:var(--paper-sunken)}
.btn-primary{
  background:var(--seal);color:#fff;border-color:var(--seal)}
.btn-primary:hover{background:var(--seal-bright);border-color:var(--seal-bright)}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}

.workspace{
  display:grid;grid-template-columns:420px 1fr;
  height:calc(100vh - 94px);overflow:hidden}
/* 手機：改為上下堆疊，兩區各自捲動 */
@media(max-width:820px){
  .workspace{grid-template-columns:1fr;height:auto;overflow:visible}
  .form-panel{border-right:none;border-bottom:var(--border-strong);max-height:none}
  .preview-panel{padding:var(--space-4) var(--space-2)}
  .preview-page{width:100%;min-height:0;padding:10mm 8mm;font-size:8pt}
}

/* ── Form Panel ── */
.form-panel{
  background:var(--paper-raised);border-right:var(--border-strong);
  overflow-y:auto;padding:var(--space-5)}
.section-head{
  font-family:var(--font-kai);font-size:var(--text-base);font-weight:700;
  color:var(--ink);margin:var(--space-5) 0 var(--space-3);
  padding-left:var(--space-3);border-left:3px solid var(--seal);
  letter-spacing:.04em}
.section-head:first-child{margin-top:0}
.field-row{display:grid;grid-template-columns:5.5em 1fr;gap:var(--space-2);
  align-items:center;margin-bottom:var(--space-2)}
.field-row label{
  font-size:var(--text-sm);color:var(--ink-soft);text-align:right;
  font-family:var(--font-kai)}
.field-row input,.field-row select{
  width:100%;padding:var(--space-2) var(--space-3);
  border:var(--border);border-radius:var(--radius);
  background:var(--paper);font-family:var(--font-song);
  font-size:var(--text-sm);color:var(--ink)}
.field-row input:focus,.field-row select:focus{
  outline:none;border-color:var(--rule-strong);
  box-shadow:0 0 0 3px var(--seal-wash)}
.opt-toggle{
  display:flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-sm);color:var(--ink-soft);
  margin-bottom:var(--space-3)}
.opt-toggle input[type=checkbox]{accent-color:var(--seal)}

/* Member cards */
.member-card{
  border:var(--border);border-radius:var(--radius-lg);
  padding:var(--space-3);margin-bottom:var(--space-3);
  background:var(--paper)}
.member-card-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--space-3)}
.member-card-title{
  font-family:var(--font-kai);font-size:var(--text-sm);
  color:var(--ink-soft);font-weight:700}
.member-card-title .name-preview{
  color:var(--seal);margin-left:var(--space-2)}
.proxy-section{
  margin-top:var(--space-3);padding-top:var(--space-3);
  border-top:var(--border)}
.proxy-label{
  font-size:var(--text-xs);color:var(--ink-faint);
  font-family:var(--font-kai);margin-bottom:var(--space-2)}
.proxy-card{
  background:var(--paper-sunken);border-radius:var(--radius);
  padding:var(--space-2) var(--space-3);margin-bottom:var(--space-2)}
.proxy-card .field-row{grid-template-columns:4.5em 1fr}
.add-row{
  display:flex;gap:var(--space-2);margin-top:var(--space-2)}

/* Heirs list */
.heir-check-row{
  display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  border-bottom:var(--border);
  background:var(--paper-raised)}
.heir-check-row:last-child{border-bottom:none}
.heir-check-row input[type=checkbox]{
  accent-color:var(--seal);width:16px;height:16px;flex-shrink:0;cursor:pointer}
.heir-check-row label{
  flex:1;font-size:var(--text-sm);cursor:pointer;
  font-family:var(--font-kai)}
.heir-check-row label.unchecked{color:var(--ink-faint);text-decoration:line-through}
.heir-check-row .heir-del{
  background:none;border:none;cursor:pointer;
  color:var(--ink-faint);font-size:var(--text-xs);
  padding:2px 4px;border-radius:var(--radius)}
.heir-check-row .heir-del:hover{color:var(--seal);background:var(--seal-wash)}
.heir-print-hint{
  font-size:var(--text-xs);color:var(--seal);
  margin-top:var(--space-1);display:flex;align-items:center;gap:4px}
.heirs-area{
  border:var(--border);border-radius:var(--radius);
  background:var(--paper-raised);margin-bottom:var(--space-2);
  overflow:hidden;min-height:40px}
.heir-add-row{display:flex;gap:var(--space-2)}
.heir-add-row input{
  flex:1;padding:var(--space-2) var(--space-3);
  border:var(--border);border-radius:var(--radius);
  background:var(--paper);font-size:var(--text-sm)}
.heir-note{
  font-size:var(--text-xs);color:var(--ink-faint);margin-top:var(--space-1)}

/* ── Preview Panel ── */
.preview-panel{
  overflow-y:auto;padding:var(--space-6);
  background:var(--paper-sunken);display:flex;
  flex-direction:column;align-items:center}
.preview-page{
  background:#fff;width:210mm;min-height:297mm;
  padding:20mm 22mm;font-family:var(--font-kai);
  font-size:10pt;box-shadow:0 2px 12px rgba(0,0,0,.1);
  position:relative}

/* ── Preview: 繼承系統表 Layout ── */
.p-title{
  text-align:center;font-size:14pt;font-weight:700;
  letter-spacing:.5em;border-bottom:1px solid #000;
  padding-bottom:8pt;margin-bottom:16pt}

/* Top section: 被繼承人 + 配偶 */
.p-top{
  display:grid;grid-template-columns:45% 10% 45%;
  margin-bottom:12pt;align-items:center}
.p-box{
  border:1px solid #000;padding:6pt 8pt;
  font-size:9pt;line-height:1.8}
.p-box p{margin:0}
.p-connector-h{
  display:flex;align-items:center;justify-content:center;
  color:#000;font-size:11pt;letter-spacing:2pt}
.p-spouse-empty{border:none}

/* Children section */
.p-children{display:flex;flex-direction:column;gap:0}
.p-child-row{
  display:grid;
  grid-template-columns:56pt 56pt 1fr 18pt 1fr;
  align-items:start;margin-bottom:4pt}
.p-group-label{
  display:flex;align-items:center;justify-content:center;
  font-size:9pt;writing-mode:horizontal-tb;height:100%}
.p-dash{
  display:flex;align-items:flex-start;padding-top:6pt;
  font-size:8pt;letter-spacing:-1pt;color:#000;
  overflow:hidden;white-space:nowrap}
.p-child-box{border:1px solid #000;padding:4pt 6pt;font-size:9pt;line-height:1.8}
.p-child-box p{margin:0}
.p-proxy-conn{
  display:flex;align-items:flex-start;padding-top:6pt;
  font-size:8pt;justify-content:center;color:#000}
.p-proxies{display:flex;flex-direction:column;gap:4pt}
.p-proxy-box{border:1px solid #000;padding:4pt 6pt;font-size:8.5pt;line-height:1.75}
.p-proxy-box p{margin:0}
.p-no-proxy{border:none;height:auto}
.p-no-proxy-conn{border:none}

/* Footer */
.p-footer{margin-top:20pt;font-size:9pt}
.p-disclaimer{
  line-height:1.9;text-align:justify;
  margin-bottom:12pt}
.p-sigs{margin-bottom:10pt}
.p-sig-row{margin-bottom:6pt}
.p-date{text-align:center;letter-spacing:4pt}

/* ── Print Media ── */
@media print{
  .sys-nav{display:none!important}
  html,body{padding-top:0!important}
  .app-header,.form-panel,.preview-panel>*:not(.preview-page){display:none!important}
  .workspace{display:block;height:auto}
  .preview-panel{
    padding:0;background:white;
    display:block}
  .preview-page{
    box-shadow:none;width:100%;min-height:0;
    padding:15mm 18mm}
}

/* ── Utilities ── */
.hint{font-size:var(--text-xs);color:var(--ink-faint);margin-top:2px}
.divider{border:none;border-top:var(--border);margin:var(--space-4) 0}
</style>
</head>
<body>
<script src="shared/sys-nav.js" data-active="heirship"></script>

<header class="app-header">
  <h1>繼承系統表<span>產生工具</span></h1>
  <div class="header-btns">
    <button class="btn btn-sm" onclick="clearAll()">清除</button>
    <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 列印／另存 PDF</button>
  </div>
</header>

<div class="workspace">

<!-- ═══════════════ FORM PANEL ═══════════════ -->
<div class="form-panel" id="formPanel">

  <!-- 被繼承人 -->
  <div class="section-head">被繼承人</div>
  <div class="field-row">
    <label>姓名</label>
    <input type="text" id="d-name" placeholder="例：駱光星" oninput="render()">
  </div>
  <div class="field-row">
    <label>稱謂</label>
    <input type="text" id="d-rel" placeholder="例：次男" oninput="render()">
  </div>
  <div class="field-row">
    <label>出生日</label>
    <input type="text" id="d-dob" placeholder="民國18年12月28日" oninput="render()">
  </div>
  <div class="field-row">
    <label>死亡日</label>
    <input type="text" id="d-dod" placeholder="民國115年4月2日" oninput="render()">
  </div>

  <!-- 配偶 -->
  <div class="section-head">配偶</div>
  <label class="opt-toggle">
    <input type="checkbox" id="sp-toggle" onchange="toggleSpouse();render()"> 有配偶
  </label>
  <div id="sp-fields" style="display:none">
    <div class="field-row">
      <label>姓名</label>
      <input type="text" id="sp-name" placeholder="例：林阿桃" oninput="render()">
    </div>
    <div class="field-row">
      <label>出生日</label>
      <input type="text" id="sp-dob" placeholder="民國30年4月24日" oninput="render()">
    </div>
    <div class="field-row">
      <label>死亡日</label>
      <input type="text" id="sp-dod" placeholder="民國--年--月--日" oninput="render()">
    </div>
    <div class="field-row">
      <label>離婚日</label>
      <input type="text" id="sp-divorce" placeholder="（無則留空）" oninput="render()">
    </div>
    <div class="field-row">
      <label>繼承情形</label>
      <select id="sp-status" onchange="render()">
        <option value="繼承">繼承</option>
        <option value="死亡">死亡</option>
        <option value="拋棄繼承">拋棄繼承</option>
      </select>
    </div>
  </div>

  <!-- 繼承群組 -->
  <div class="section-head">繼承群組</div>
  <div class="field-row">
    <label>群組標籤</label>
    <input type="text" id="grp-label" value="子女" oninput="render()">
  </div>
  <div id="members-container"></div>
  <button class="btn btn-sm" onclick="addMember()">＋ 新增成員</button>

  <hr class="divider">

  <!-- 繼承人簽名 -->
  <div class="section-head">繼承人（簽名欄）</div>
  <div class="hint">勾選者才會列印於文件簽名欄</div>
  <div class="heirs-area" id="heirs-area"></div>
  <div class="heir-print-hint" id="heir-count-hint"></div>
  <div class="heir-add-row">
    <input type="text" id="heir-input" placeholder="手動新增繼承人姓名" onkeydown="if(event.key==='Enter')addHeir()">
    <button class="btn btn-sm" onclick="addHeir()">新增</button>
    <button class="btn btn-sm" onclick="autoHeirs()">自動帶入</button>
  </div>

  <hr class="divider">

  <!-- 申請日 -->
  <div class="section-head">申請日</div>
  <div class="field-row">
    <label>申請日期</label>
    <input type="text" id="apply-date" placeholder="例：115年8月14日" oninput="render()">
  </div>

</div><!-- /form-panel -->

<!-- ═══════════════ PREVIEW PANEL ═══════════════ -->
<div class="preview-panel">
  <div class="preview-page" id="previewPage">
    <!-- rendered by render() -->
  </div>
</div>

</div><!-- /workspace -->

<script>
/* ═══════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════ */
let members = [];   // {id, name, rel, dob, dod, status, proxies:[{name,rel,dob,dod,status}]}
let heirs   = [];   // [{name}]
let memberIdx = 0;

/* ═══════════════════════════════════════════════
   Member / Proxy Management
   ═══════════════════════════════════════════════ */
function addMember(){
  const id = ++memberIdx;
  members.push({id, name:'', rel:'', dob:'', dod:'', status:'繼承', proxies:[]});
  renderForm();
  render();
}

function removeMember(id){
  members = members.filter(m=>m.id!==id);
  renderForm(); render();
}

function updateMember(id, field, val){
  const m = members.find(m=>m.id===id);
  if(m){ m[field]=val; render(); }
}

function onStatusChange(id, val){
  updateMember(id, 'status', val);
  renderForm();
}

function addProxy(memberId){
  const m = members.find(m=>m.id===memberId);
  if(m) m.proxies.push({name:'',rel:'',dob:'',dod:'',status:'繼承'});
  renderForm(); render();
}

function removeProxy(memberId, pIdx){
  const m = members.find(m=>m.id===memberId);
  if(m){ m.proxies.splice(pIdx,1); renderForm(); render(); }
}

function updateProxy(memberId, pIdx, field, val){
  const m = members.find(m=>m.id===memberId);
  if(m && m.proxies[pIdx]){ m.proxies[pIdx][field]=val; render(); }
}

/* ═══════════════════════════════════════════════
   Form Rendering
   ═══════════════════════════════════════════════ */
const STATUS_OPTS = ['繼承','死亡','代位繼承','拋棄繼承','喪失繼承權'];
const REL_OPTS = ['長男','次男','三男','肆男','伍男','長女','次女','三女','肆女','父','母','長兄','次兄','長姊'];

function relSelect(val, onChange){
  const opts = REL_OPTS.map(r=>`<option${r===val?' selected':''}>${r}</option>`).join('');
  return `<select onchange="${onChange}" style="flex:1">
    <option value="">-- 選擇 --</option>${opts}
    <option value="__custom">自訂…</option>
  </select>`;
}

function renderForm(){
  const container = document.getElementById('members-container');
  container.innerHTML = members.map((m,idx)=>{
    const needProxy = m.status==='代位繼承';
    const proxyHTML = needProxy ? `
      <div class="proxy-section">
        <div class="proxy-label">代位繼承人</div>
        ${m.proxies.map((p,pi)=>`
          <div class="proxy-card">
            <div class="member-card-head">
              <span class="member-card-title">代位繼承人 ${pi+1}</span>
              <button class="btn btn-sm" onclick="removeProxy(${m.id},${pi})">移除</button>
            </div>
            <div class="field-row">
              <label>姓名</label>
              <input type="text" value="${p.name}" placeholder="姓名"
                oninput="updateProxy(${m.id},${pi},'name',this.value)">
            </div>
            <div class="field-row">
              <label>稱謂</label>
              <input type="text" value="${p.rel}" placeholder="例：長男"
                oninput="updateProxy(${m.id},${pi},'rel',this.value)">
            </div>
            <div class="field-row">
              <label>出生日</label>
              <input type="text" value="${p.dob}" placeholder="民國--年--月--日"
                oninput="updateProxy(${m.id},${pi},'dob',this.value)">
            </div>
            <div class="field-row">
              <label>死亡日</label>
              <input type="text" value="${p.dod}" placeholder="民國--年--月--日"
                oninput="updateProxy(${m.id},${pi},'dod',this.value)">
            </div>
            <div class="field-row">
              <label>繼承情形</label>
              <select onchange="updateProxy(${m.id},${pi},'status',this.value)">
                ${STATUS_OPTS.filter(s=>s!=='代位繼承').map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
        <button class="btn btn-sm" onclick="addProxy(${m.id})">＋ 新增代位繼承人</button>
      </div>` : '';

    return `
    <div class="member-card">
      <div class="member-card-head">
        <span class="member-card-title">成員 ${idx+1}
          <span class="name-preview">${m.name||'（未命名）'}</span>
        </span>
        <button class="btn btn-sm" onclick="removeMember(${m.id})">移除</button>
      </div>
      <div class="field-row">
        <label>姓名</label>
        <input type="text" value="${m.name}" placeholder="姓名"
          oninput="updateMember(${m.id},'name',this.value);this.closest('.member-card').querySelector('.name-preview').textContent=this.value||'（未命名）'">
      </div>
      <div class="field-row">
        <label>稱謂</label>
        <input type="text" value="${m.rel}" placeholder="例：長男、肆男、長女"
          oninput="updateMember(${m.id},'rel',this.value)">
      </div>
      <div class="field-row">
        <label>出生日</label>
        <input type="text" value="${m.dob}" placeholder="民國--年--月--日"
          oninput="updateMember(${m.id},'dob',this.value)">
      </div>
      <div class="field-row">
        <label>死亡日</label>
        <input type="text" value="${m.dod}" placeholder="民國--年--月--日"
          oninput="updateMember(${m.id},'dod',this.value)">
      </div>
      <div class="field-row">
        <label>繼承情形</label>
        <select onchange="onStatusChange(${m.id},this.value)">
          ${STATUS_OPTS.map(s=>`<option${s===m.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      ${proxyHTML}
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════
   Heirs
   ═══════════════════════════════════════════════ */
function renderHeirsArea(){
  const area = document.getElementById('heirs-area');
  if(!heirs.length){
    area.innerHTML='<div style="padding:var(--space-2) var(--space-3);color:var(--ink-faint);font-size:var(--text-xs)">尚無繼承人，請手動新增或點「自動帶入」</div>';
    document.getElementById('heir-count-hint').innerHTML='';
    return;
  }
  area.innerHTML = heirs.map((h,i)=>`
    <div class="heir-check-row">
      <input type="checkbox" id="heir-chk-${i}" ${h.selected?'checked':''}
        onchange="toggleHeir(${i},this.checked)">
      <label for="heir-chk-${i}" class="${h.selected?'':'unchecked'}">${esc(h.name)}</label>
      <button class="heir-del" onclick="removeHeir(${i})" title="移除">✕</button>
    </div>`).join('');
  const onCount = heirs.filter(h=>h.selected).length;
  const hint = document.getElementById('heir-count-hint');
  hint.innerHTML = onCount > 0
    ? `☑ 已勾選 ${onCount} 人，列印時顯示於簽名欄`
    : `<span style="color:var(--ink-faint)">未勾選任何人，簽名欄將留空</span>`;
}

function toggleHeir(i, val){
  heirs[i].selected = val;
  renderHeirsArea(); render();
}

function addHeir(){
  const inp = document.getElementById('heir-input');
  const name = inp.value.trim();
  if(!name) return;
  heirs.push({name, selected:true});
  inp.value='';
  renderHeirsArea(); render();
}

function removeHeir(i){
  heirs.splice(i,1);
  renderHeirsArea(); render();
}

function autoHeirs(){
  const auto = [];
  const spName = document.getElementById('sp-name').value.trim();
  const spStatus = document.getElementById('sp-status').value;
  if(spName && spStatus==='繼承') auto.push({name:spName, selected:true});

  members.forEach(m=>{
    if(m.status==='繼承') auto.push({name:m.name, selected:true});
    if(m.status==='代位繼承'){
      m.proxies.forEach(p=>{
        if(p.status==='繼承') auto.push({name:p.name, selected:true});
      });
    }
  });
  heirs = auto.filter(h=>h.name);
  renderHeirsArea(); render();
}

/* ═══════════════════════════════════════════════
   Spouse toggle
   ═══════════════════════════════════════════════ */
function toggleSpouse(){
  const on = document.getElementById('sp-toggle').checked;
  document.getElementById('sp-fields').style.display = on?'block':'none';
}

/* ═══════════════════════════════════════════════
   Preview Rendering
   ═══════════════════════════════════════════════ */
function fmtDate(s){ return s&&s.trim() ? s.trim() : '民國--年--月--日'; }
function fmtDisDate(s){ return s&&s.trim() ? s.trim() : '民國--年--月--日'; }

function boxHTML(lines){
  return `<div class="p-box">${lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}
function proxyBoxHTML(p){
  return `<div class="p-proxy-box">
    <p>姓名：${esc(p.name||'')}</p>
    <p>稱謂：${esc(p.rel||'')}</p>
    <p>出生日：${esc(fmtDate(p.dob))}</p>
    <p>死亡日：${esc(fmtDate(p.dod))}</p>
    <p>繼承情形：${esc(p.status||'繼承')}</p>
  </div>`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function render(){
  const dName    = document.getElementById('d-name').value.trim();
  const dRel     = document.getElementById('d-rel').value.trim();
  const dDob     = document.getElementById('d-dob').value.trim();
  const dDod     = document.getElementById('d-dod').value.trim();
  const spOn     = document.getElementById('sp-toggle').checked;
  const spName   = document.getElementById('sp-name').value.trim();
  const spDob    = document.getElementById('sp-dob').value.trim();
  const spDod    = document.getElementById('sp-dod').value.trim();
  const spDiv    = document.getElementById('sp-divorce').value.trim();
  const spStatus = document.getElementById('sp-status').value;
  const grpLabel = document.getElementById('grp-label').value.trim() || '子女';
  const applyDate= document.getElementById('apply-date').value.trim();

  /* 被繼承人 box */
  const decedentBox = boxHTML([
    `被繼承人：${dName}`,
    `稱謂：${dRel}`,
    `出生日：${fmtDate(dDob)}`,
    `死亡日：${fmtDate(dDod)}`
  ]);

  /* 配偶 box */
  let spouseBox = `<div class="p-spouse-empty"></div>`;
  let connectorTop = `<div class="p-connector-h"></div>`;
  if(spOn && spName){
    const spLines = [
      `姓名：${spName}`,
      `稱謂：配偶`,
      `離婚日：${fmtDisDate(spDiv)}`,
      `出生日：${fmtDate(spDob)}`,
      `死亡日：${fmtDate(spDod)}`,
      `繼承情形：${spStatus}`
    ];
    spouseBox = boxHTML(spLines);
    connectorTop = `<div class="p-connector-h">─ ─ ─</div>`;
  }

  /* Children rows */
  const midIdx = Math.floor(members.length / 2);
  const childRows = members.map((m, idx)=>{
    const hasProxy = m.status==='代位繼承' && m.proxies.length>0;
    const label = idx===midIdx
      ? `<div class="p-group-label">${esc(grpLabel)}</div>`
      : `<div class="p-group-label"></div>`;

    const childLines = [
      `姓名：${m.name||''}`,
      `稱謂：${m.rel||''}`,
      `出生日：${fmtDate(m.dob)}`,
      `死亡日：${fmtDate(m.dod)}`,
      `繼承情形：${m.status}`
    ];
    const childBox = `<div class="p-child-box">${childLines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;

    const proxiesHTML = hasProxy
      ? `<div class="p-proxy-conn">─</div><div class="p-proxies">${m.proxies.map(proxyBoxHTML).join('')}</div>`
      : `<div class="p-no-proxy-conn"></div><div class="p-no-proxy"></div>`;

    return `<div class="p-child-row">
      ${label}
      <div class="p-dash">──────────</div>
      ${childBox}
      ${proxiesHTML}
    </div>`;
  }).join('');

  /* Signatures — 只列印有勾選的繼承人 */
  const selectedHeirs = heirs.filter(h=>h.selected);
  const sigLines = selectedHeirs.length>0
    ? selectedHeirs.map(h=>`<p class="p-sig-row">繼承人：${esc(h.name)}　　　蓋章：</p>`).join('')
    : `<p class="p-sig-row">繼承人：　　　　　　　　　　蓋章：</p>`;

  /* Date */
  const dateStr = applyDate
    ? `中　　華　　民　　國　　${applyDate}`
    : '中　　華　　民　　國　　　　　年　　　月　　　日';

  /* Compose page */
  document.getElementById('previewPage').innerHTML = `
    <div class="p-title">繼　承　系　統　表</div>

    <div class="p-top">
      ${decedentBox}
      ${connectorTop}
      ${spouseBox}
    </div>

    <div class="p-children">
      ${childRows}
    </div>

    <div class="p-footer">
      <p class="p-disclaimer">上繼承系統表係參酌民法第一一三八條至一一四○條之規定訂立，如有遺漏或錯誤致他人受損害者，申請人願負法律責任。</p>
      <div class="p-sigs">${sigLines}</div>
      <p class="p-date">${esc(dateStr)}</p>
    </div>
  `;
}

/* ═══════════════════════════════════════════════
   Utilities
   ═══════════════════════════════════════════════ */
function clearAll(){
  if(!confirm('確定清除所有輸入？')) return;
  document.querySelectorAll('#formPanel input[type=text], #formPanel input[type=checkbox], #formPanel select')
    .forEach(el=>{
      if(el.type==='checkbox') el.checked=false;
      else if(el.tagName==='SELECT') el.selectedIndex=0;
      else el.value='';
    });
  document.getElementById('grp-label').value='子女';
  members=[]; heirs=[]; memberIdx=0;
  document.getElementById('sp-fields').style.display='none';
  renderForm(); renderHeirsArea(); render();
}

/* ═══════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════ */
(function init(){
  // 以空白表單啟動（不預載任何當事人資料）；申請日預設為今日（民國年）
  const now = new Date(Date.now()+8*3600000);
  document.getElementById('apply-date').value =
    `${now.getUTCFullYear()-1911}年${now.getUTCMonth()+1}月${now.getUTCDate()}日`;
  addMember(); // 先給一列成員方便直接輸入
  renderHeirsArea();
  render();
})();
</script>
